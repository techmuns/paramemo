<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Paragon Partners · Screening Memo</title>
  <meta name="description" content="Deal pipeline screening memos for Paragon Partners — read before Monday's meeting." />
  <!-- Inline favicon: navy tile + gold "P" monogram (no extra request, avoids /favicon.ico 404) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230C3078'/%3E%3Ctext x='16' y='22' font-family='Sora,Arial,sans-serif' font-size='18' font-weight='700' fill='%23fff' text-anchor='middle'%3EP%3C/text%3E%3Crect x='9' y='24' width='14' height='2' rx='1' fill='%23B4924C'/%3E%3C/svg%3E" />

  <!-- Fonts: Inter (body) + Sora (headings / numbers), with a proper fallback stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind (CDN, no build step) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Paragon design tokens exposed as Tailwind utilities (bg-navy, text-gold, …).
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:    { DEFAULT: '#0C3078', dark: '#0a2660' },
            gold:    '#B4924C',
            ink:     { DEFAULT: '#111827', muted: '#6B7280', hint: '#9CA3AF' },
            surface: '#F7F8FB',
            go:      '#10B981',
            watch:   '#F59E0B',
            pass:    '#E11D48',
          },
          fontFamily: {
            sans:    ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            display: ['Sora', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Charts: Chart.js v4 (tooltips + legends work out of the box) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!--
    Design system / component styles.
    Layout is done with Tailwind utility classes in markup; reusable "components"
    (cards, pills, table, tooltip, toast, modal) live here as plain CSS so the
    look is standardised in one place and easy to extend in later phases.
  -->
  <style>
    :root {
      --navy: #0C3078;  --navy-d: #0a2660;  --gold: #B4924C;
      --ink: #111827;   --muted: #6B7280;   --hint: #9CA3AF;
      --surface: #F7F8FB; --card: #FFFFFF;  --border: #E7EAF1;
      --border-strong: #DDE2EC;

      /* one standardised radius + shadow scale */
      --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
      --shadow-sm: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
      --shadow-md: 0 4px 12px -2px rgba(16,24,40,.08), 0 2px 6px -2px rgba(16,24,40,.06);
      --shadow-lg: 0 20px 44px -14px rgba(12,48,120,.24), 0 8px 18px -10px rgba(16,24,40,.12);
      --ring-navy: 0 0 0 3px rgba(12,48,120,.14);
    }

    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--surface);
      /* subtle navy-tinted ambience so the surface isn't sterile */
      background-image:
        radial-gradient(1100px 460px at 92% -8%, rgba(12,48,120,.06), transparent 60%),
        radial-gradient(900px 420px at 2% 0%, rgba(180,146,76,.06), transparent 55%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Tabular numerals everywhere numbers must align into columns */
    .tnum { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }
    .font-display { font-family: 'Sora', 'Inter', sans-serif; }

    /* ---- Header ---------------------------------------------------------- */
    .app-header {
      background: linear-gradient(100deg, var(--navy) 0%, var(--navy-d) 62%, #081f52 100%);
      box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, var(--shadow-md);
    }
    .monogram {
      width: 40px; height: 40px; border-radius: 11px;
      display: grid; place-items: center;
      font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px;
      color: #fff;
      background: linear-gradient(150deg, #123a8c, #0a2660);
      border: 1px solid rgba(180,146,76,.55);
      box-shadow: 0 2px 8px rgba(0,0,0,.25), 0 0 0 3px rgba(180,146,76,.12);
      position: relative; letter-spacing: .5px;
    }
    .monogram::after { /* thin gold underline accent */
      content: ''; position: absolute; left: 9px; right: 9px; bottom: 6px; height: 2px;
      background: var(--gold); border-radius: 2px; opacity: .85;
    }
    .eyebrow {
      font-family: 'Sora', sans-serif; font-weight: 600; font-size: 10.5px;
      letter-spacing: .18em; color: var(--gold); text-transform: uppercase;
    }
    .product-title {
      font-family: 'Sora', sans-serif; font-weight: 600; font-size: 17px;
      color: #fff; line-height: 1.15;
    }
    .hdr-btn {
      display: inline-flex; align-items: center; gap: 8px;
      height: 38px; padding: 0 12px; border-radius: 10px;
      font-size: 13.5px; font-weight: 500; color: #EAF0FF;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.16);
      transition: background .16s, border-color .16s, transform .16s;
      white-space: nowrap;
    }
    .hdr-btn:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.28); }
    .hdr-btn:active { transform: translateY(1px); }
    .hdr-btn[disabled], .hdr-btn.is-disabled { opacity: .5; cursor: not-allowed; }
    .hdr-btn.is-disabled:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16); }

    /* ---- Dropdown menu --------------------------------------------------- */
    .dd-menu {
      position: absolute; right: 0; top: calc(100% + 8px); z-index: 50;
      width: 320px; max-width: min(320px, 86vw);
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; box-shadow: var(--shadow-lg);
      padding: 6px; transform-origin: top right;
      animation: pop .14s ease-out;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
    .dd-item {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 9px 10px; border-radius: 10px; text-align: left;
      transition: background .14s;
    }
    .dd-item:hover { background: #F2F5FB; }
    .dd-item.is-current { background: #EEF3FC; box-shadow: inset 2px 0 0 var(--navy); }
    .dd-head { padding: 8px 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--hint); text-transform: uppercase; }

    /* ---- Segmented (Cards / Table) toggle -------------------------------- */
    .seg { display: inline-flex; gap: 3px; padding: 4px; background: #EEF1F7; border: 1px solid var(--border); border-radius: 999px; }
    .seg-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 15px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
      color: var(--muted); transition: color .16s, background .16s, box-shadow .16s;
    }
    .seg-btn:hover { color: var(--ink); }
    .seg-btn.is-active { color: #fff; background: var(--navy); box-shadow: var(--shadow-sm); }

    /* ---- Generic surface / chips / labels -------------------------------- */
    .surface-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
    .kicker { font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--hint); }
    .count-chip {
      display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px;
      border-radius: 999px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 13px;
      color: var(--navy); background: rgba(12,48,120,.08); border: 1px solid rgba(12,48,120,.12);
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
      line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chip .chip-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }

    /* ---- Fit light pill -------------------------------------------------- */
    .fit-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 4px 11px 4px 9px; border-radius: 999px;
      font-size: 12.5px; font-weight: 700; line-height: 1.2; white-space: nowrap;
      cursor: default;
    }
    .fit-pill .fit-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 0 3px rgba(255,255,255,.5); }
    .fit-pill .fit-dot.pulse { animation: fitpulse 2.2s ease-in-out infinite; }
    @keyframes fitpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.0); } 50% { box-shadow: 0 0 0 4px rgba(16,185,129,.18); } }

    /* ---- Deal card ------------------------------------------------------- */
    .deal-card {
      position: relative; display: flex; flex-direction: column;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg);
      padding: 18px; box-shadow: var(--shadow-sm); cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      overflow: hidden;
    }
    .deal-card::before { /* top accent bar, tinted by sector; revealed on hover */
      content: ''; position: absolute; inset: 0 0 auto 0; height: 3px;
      background: var(--accent, var(--navy)); opacity: 0; transition: opacity .18s;
    }
    .deal-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--border-strong); }
    .deal-card:hover::before { opacity: .9; }
    .deal-card:focus-visible { outline: none; box-shadow: var(--ring-navy), var(--shadow-md); }

    .monogram-badge {
      width: 46px; height: 46px; border-radius: 13px; flex: 0 0 auto;
      display: grid; place-items: center;
      font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .3px;
      color: #fff; background: linear-gradient(150deg, #16419b, #0a2660);
      box-shadow: inset 0 0 0 1px rgba(180,146,76,.4), 0 3px 8px rgba(12,48,120,.22);
    }
    .card-title { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px; color: var(--ink); line-height: 1.2; }
    .card-sub   { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .card-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border) 12%, var(--border) 88%, transparent); margin: 15px 0; }
    .deal-amount { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 17px; color: var(--ink); line-height: 1.15; margin-top: 3px; }
    .deal-type  { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .meta-line  { font-size: 12.5px; color: var(--ink); font-weight: 500; }
    .meta-sub   { font-size: 11.5px; color: var(--hint); margin-top: 1px; }

    .spark-wrap { position: relative; height: 58px; width: 100%; }
    .spark-cap  { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
    .spark-cap b { color: var(--ink); font-family: 'Sora', sans-serif; font-weight: 600; }
    .spark-legend { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--hint); }
    .legend-line { width: 14px; height: 0; border-top: 2px solid var(--navy); }
    .legend-line.dash { border-top-style: dashed; }

    /* ---- Add-a-deal affordance ------------------------------------------ */
    .add-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      min-height: 220px; padding: 20px; text-align: center;
      background: rgba(12,48,120,.02); border: 1.5px dashed var(--border-strong); border-radius: var(--r-lg);
      color: var(--muted); transition: border-color .18s, background .18s, transform .18s, color .18s;
    }
    .add-card:hover { border-color: var(--navy); background: rgba(12,48,120,.05); color: var(--navy); transform: translateY(-2px); }
    .add-card .plus { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(12,48,120,.08); color: var(--navy); transition: background .18s; }
    .add-card:hover .plus { background: var(--navy); color: #fff; }
    .add-btn-row {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      padding: 16px; border: 1.5px dashed var(--border-strong); border-radius: var(--r-md);
      background: rgba(12,48,120,.02); color: var(--navy); font-weight: 600; font-size: 14px;
      transition: border-color .18s, background .18s;
    }
    .add-btn-row:hover { border-color: var(--navy); background: rgba(12,48,120,.05); }

    /* ---- Table ----------------------------------------------------------- */
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--r-lg); }
    table.deal-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 720px; }
    .deal-table thead th {
      position: sticky; top: 0; z-index: 1;
      background: #F4F6FB; border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
      padding: 12px 16px; text-align: left; white-space: nowrap; cursor: pointer; user-select: none;
      transition: color .14s, background .14s;
    }
    .deal-table thead th:hover { color: var(--navy); background: #EEF2FA; }
    .deal-table thead th.num { text-align: right; }
    .deal-table thead th .th-inner { display: inline-flex; align-items: center; gap: 6px; }
    .deal-table thead th.num .th-inner { flex-direction: row-reverse; }
    .sort-ico { color: var(--hint); opacity: .6; transition: opacity .14s, color .14s, transform .14s; }
    .deal-table thead th.is-sorted .sort-ico { color: var(--navy); opacity: 1; }
    .deal-table tbody td { padding: 13px 16px; border-bottom: 1px solid #EEF1F6; vertical-align: middle; font-size: 13.5px; }
    .deal-table tbody tr { cursor: pointer; transition: background .13s; }
    .deal-table tbody tr:hover { background: #F5F8FE; }
    .deal-table tbody tr:last-child td { border-bottom: none; }
    .deal-table td.num { text-align: right; }
    .row-name { display: block; font-weight: 600; color: var(--ink); }
    .row-sub  { display: block; font-size: 11.5px; color: var(--hint); margin-top: 1px; }
    .monogram-mini {
      width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto; display: grid; place-items: center;
      font-family: 'Sora', sans-serif; font-weight: 700; font-size: 12px; color: #fff;
      background: linear-gradient(150deg, #16419b, #0a2660); box-shadow: inset 0 0 0 1px rgba(180,146,76,.35);
    }

    /* ---- Floating tooltip (never clipped by containers) ------------------ */
    .tipbox {
      position: fixed; z-index: 100; max-width: 260px; pointer-events: none;
      background: #111827; color: #fff; font-size: 12px; line-height: 1.45; font-weight: 500;
      padding: 8px 10px; border-radius: 9px; box-shadow: 0 10px 30px rgba(0,0,0,.24);
      opacity: 0; transform: translateY(3px); transition: opacity .14s, transform .14s;
    }
    .tipbox.show { opacity: 1; transform: none; }
    .tipbox::after {
      content: ''; position: absolute; left: var(--arrow, 50%); margin-left: -5px; border: 5px solid transparent; border-top-color: #111827;
    }
    .tipbox[data-place="above"]::after { top: 100%; }
    .tipbox[data-place="below"]::after { bottom: 100%; border-top-color: transparent; border-bottom-color: #111827; }

    /* ---- Toast ----------------------------------------------------------- */
    #toast-root { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; }
    .toast {
      display: inline-flex; align-items: center; gap: 10px; pointer-events: auto;
      background: #0F1B33; color: #fff; padding: 11px 16px; border-radius: 12px;
      font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255,255,255,.08);
      opacity: 0; transform: translateY(12px) scale(.98); transition: opacity .22s, transform .22s;
      max-width: 92vw;
    }
    .toast.show { opacity: 1; transform: none; }

    /* ---- Modal ----------------------------------------------------------- */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px;
      background: rgba(9,18,42,.55); backdrop-filter: blur(3px);
      opacity: 0; transition: opacity .18s;
    }
    .modal-overlay.show { opacity: 1; }
    .modal {
      width: 100%; max-width: 520px; background: var(--card); border-radius: var(--r-xl);
      box-shadow: var(--shadow-lg); border: 1px solid var(--border); overflow: hidden;
      transform: translateY(10px) scale(.98); transition: transform .2s;
    }
    .modal-overlay.show .modal { transform: none; }
    .dropzone {
      display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
      padding: 30px 20px; border: 1.5px dashed var(--border-strong); border-radius: var(--r-md);
      background: #FAFBFE; color: var(--muted); cursor: not-allowed;
    }
    .file-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: #F2F5FB; border: 1px solid var(--border); font-size: 12.5px; font-weight: 500; color: var(--ink); }

    /* ---- Skeleton / shimmer --------------------------------------------- */
    .sk { position: relative; overflow: hidden; background: #EEF1F6; border-radius: 8px; }
    .sk::after {
      content: ''; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { 100% { transform: translateX(100%); } }

    /* ==================================================================== *
     *  COMPANY VIEW (Phases 2–3): identity strip, tabs, snapshot, financials
     * ==================================================================== */

    /* ---- Back button ---- */
    .back-btn {
      display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px 0 9px;
      border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted);
      background: #fff; border: 1px solid var(--border); box-shadow: var(--shadow-sm);
      transition: color .15s, border-color .15s, transform .15s, background .15s;
    }
    .back-btn:hover { color: var(--navy); border-color: var(--border-strong); transform: translateX(-2px); }
    .rm-btn {
      display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 10px;
      border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted);
      background: #fff; border: 1px solid var(--border); box-shadow: var(--shadow-sm);
      transition: color .15s, border-color .15s, background .15s;
    }
    .rm-btn:hover { color: #E11D48; border-color: rgba(225,29,72,.35); background: rgba(225,29,72,.04); }

    /* ---- Identity strip (compact, not KPI cards) ---- */
    .identity {
      display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px;
      padding: 16px 18px; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
      background-image: linear-gradient(100deg, rgba(12,48,120,.035), transparent 40%);
    }
    .identity .id-block { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .id-divider { width: 1px; align-self: stretch; background: var(--border); margin: 2px 0; }
    @media (max-width: 700px) { .id-divider { display: none; } }
    .id-name { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 18px; color: var(--ink); line-height: 1.15; }
    .id-project { font-size: 12.5px; color: var(--muted); }

    /* ---- Tab bar (navy text + gold/navy underline on active) ---- */
    .tabbar { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); }
    .tabbar::-webkit-scrollbar { display: none; }
    .tab {
      position: relative; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
      padding: 12px 14px 13px; font-size: 13.5px; font-weight: 600; color: var(--hint);
      border-bottom: 2.5px solid transparent; margin-bottom: -1px; transition: color .15s;
    }
    .tab:hover { color: var(--muted); }
    .tab .tab-ico { color: currentColor; opacity: .9; }
    .tab.is-active { color: var(--navy); border-bottom-color: var(--navy); }
    .tab.is-active::after { /* gold under-accent */
      content: ''; position: absolute; left: 14px; right: 14px; bottom: -2.5px; height: 2.5px;
      background: linear-gradient(90deg, var(--gold), transparent); opacity: .7;
    }
    .tab.is-soon { color: var(--hint); }
    .tab .soon-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); opacity: .55; }

    /* ---- Section titles + generic content ---- */
    .section { }
    .section-title {
      display: flex; align-items: center; gap: 9px; margin-bottom: 12px;
      font-family: 'Sora', sans-serif; font-weight: 600; font-size: 14.5px; color: var(--ink);
    }
    .section-title .sec-ico {
      display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px;
      color: var(--navy); background: rgba(12,48,120,.07); border: 1px solid rgba(12,48,120,.1);
    }
    .lede { font-size: 14px; line-height: 1.6; color: #374151; }

    /* Business bullet chips */
    .bullet-chip {
      display: inline-flex; align-items: flex-start; gap: 8px; padding: 8px 12px 8px 10px;
      border-radius: 10px; background: #F4F6FB; border: 1px solid var(--border);
      font-size: 12.5px; line-height: 1.35; color: #374151; font-weight: 500;
    }
    .bullet-chip .b-ico { color: var(--gold); margin-top: 1px; flex: 0 0 auto; }

    /* Facts table (key/value) */
    .facts { width: 100%; border-collapse: collapse; }
    .facts th, .facts td { padding: 9px 2px; border-bottom: 1px dashed var(--border); text-align: left; vertical-align: top; font-size: 13px; }
    .facts tr:last-child th, .facts tr:last-child td { border-bottom: none; }
    .facts th { font-weight: 500; color: var(--muted); width: 42%; white-space: nowrap; }
    .facts td { color: var(--ink); font-weight: 500; }

    /* Promoter cards */
    .person-card {
      padding: 13px 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md);
      box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s;
    }
    .person-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
    .person-avatar {
      width: 36px; height: 36px; border-radius: 10px; flex: 0 0 auto; display: grid; place-items: center;
      font-family: 'Sora', sans-serif; font-weight: 700; font-size: 12.5px; color: #fff;
      background: linear-gradient(150deg, #16419b, #0a2660); box-shadow: inset 0 0 0 1px rgba(180,146,76,.35);
    }
    .person-name { font-weight: 600; font-size: 13.5px; color: var(--ink); line-height: 1.2; }
    .person-role { font-size: 11.5px; color: var(--navy); font-weight: 600; }
    .person-note { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 5px; }

    /* Management / generic compact table */
    .mini-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .mini-table thead th {
      text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      color: var(--muted); padding: 9px 12px; background: #F4F6FB; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .mini-table tbody td { padding: 10px 12px; border-bottom: 1px solid #EEF1F6; font-size: 13px; vertical-align: top; }
    .mini-table tbody tr:last-child td { border-bottom: none; }
    .mini-table tbody tr:hover { background: #F7F9FD; }

    /* Ownership note callout */
    .callout {
      display: flex; gap: 11px; padding: 14px 16px; border-radius: var(--r-md);
      background: rgba(180,146,76,.07); border: 1px solid rgba(180,146,76,.28);
      font-size: 13px; line-height: 1.55; color: #4b4636;
    }
    .callout .co-ico { color: var(--gold); flex: 0 0 auto; margin-top: 1px; }

    /* ---- Financials controls ---- */
    .fin-unit { font-size: 12px; color: var(--muted); font-weight: 500; }
    .fin-unit b { font-family: 'Sora', sans-serif; color: var(--ink); font-weight: 600; }
    .switch {
      display: inline-flex; align-items: center; gap: 3px; padding: 3px; border-radius: 999px;
      background: #EEF1F7; border: 1px solid var(--border);
    }
    .switch button {
      padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted);
      white-space: nowrap; transition: color .15s, background .15s, box-shadow .15s;
    }
    .switch button.on { color: #fff; background: var(--navy); box-shadow: var(--shadow-sm); }
    .switch button:not(.on):hover { color: var(--ink); }

    /* ---- Financials hero table ---- */
    .fin-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--r-lg); }
    table.fin { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 620px; }
    .fin th, .fin td { padding: 8px 12px; font-size: 13px; white-space: nowrap; }
    .fin thead th {
      position: sticky; top: 0; z-index: 2; background: #F4F6FB; border-bottom: 1px solid var(--border);
      font-family: 'Sora', sans-serif; font-weight: 600; font-size: 12px; color: var(--ink); text-align: right;
    }
    .fin thead th.rowhead { text-align: left; }
    .fin .rowhead {
      position: sticky; left: 0; z-index: 1; background: var(--card); text-align: left;
      font-weight: 500; color: var(--ink); box-shadow: 1px 0 0 var(--border);
    }
    .fin thead th.rowhead { z-index: 3; background: #F4F6FB; }
    .fin td.val { text-align: right; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; color: var(--ink); }
    .fin td.val.neg { color: #DC2626; }
    .fin td.val.muted { color: var(--hint); }
    .fin tbody tr:hover td { background: #F7F9FD; }
    .fin tbody tr:hover .rowhead { background: #F7F9FD; }
    .fin tr.group td {
      background: #EFF2F8; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 10.5px;
      letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 7px 12px;
      position: sticky; left: 0;
    }
    /* forecast columns: subtle tint + a divider before the first one */
    .fin .fc { background: rgba(180,146,76,.06); }
    .fin thead th.fc { background: #F1EFE6; }
    .fin .fc-start { border-left: 2px solid rgba(180,146,76,.4); }
    .fin tbody tr:hover td.fc { background: rgba(180,146,76,.11); }
    /* CAGR summary columns (right side) */
    .fin th.cagr, .fin td.cagr { text-align: right; background: #F4F6FB; border-left: 1px solid var(--border); font-style: italic; }
    .fin th.cagr { font-style: normal; color: var(--muted); line-height: 1.15; }
    .fin th.cagr span { display: block; font-size: 9.5px; font-weight: 500; color: var(--hint); font-style: normal; }
    .fin td.cagr { font-weight: 600; color: var(--navy); }
    .fin td.cagr.muted { color: var(--hint); font-weight: 500; }
    /* sub-metrics (growth, margins) sit quietly under their headline row */
    .fin tr.subrow .rowhead { font-weight: 400; color: var(--muted); padding-left: 22px; font-size: 12px; }
    .fin tr.subrow td.val { color: var(--muted); }
    /* % mini-bar under the number */
    .cellwrap { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 3px; min-width: 44px; }
    .minibar { width: 100%; height: 3px; border-radius: 2px; background: rgba(17,24,39,.07); overflow: hidden; }
    .minibar > span { display: block; height: 100%; border-radius: 2px; }

    /* ---- Supporting chart cards ---- */
    .chart-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm); padding: 14px 16px 12px;
    }
    .chart-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .chart-title { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 13px; color: var(--ink); }
    .chart-box { position: relative; height: 230px; width: 100%; }

    /* ---- Coming-soon empty state ---- */
    .coming {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 56px 24px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
    }
    .coming .cs-ico {
      display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; margin-bottom: 16px;
      color: var(--navy); background: rgba(12,48,120,.07); border: 1px solid rgba(12,48,120,.1);
    }
    .coming .cs-badge {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 5px 12px; border-radius: 999px;
      font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      color: var(--gold); background: rgba(180,146,76,.1); border: 1px solid rgba(180,146,76,.3);
    }

    /* ==================================================================== *
     *  PHASES 4–5 — Fit · Integrity · Questions · Thesis · Returns
     * ==================================================================== */

    /* Shared small bits */
    .group-head { font-family: 'Sora', sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--hint); padding: 14px 0 4px; }
    .group-head:first-of-type { padding-top: 4px; }
    .dot-sm { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }

    /* ---- Fit ---- */
    .fit-badge-lg {
      display: inline-flex; align-items: center; gap: 9px; flex: 0 0 auto;
      padding: 8px 16px 8px 13px; border-radius: 999px;
      font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px; line-height: 1;
    }
    .fit-badge-lg .fit-dot { width: 11px; height: 11px; }
    .meter { display: flex; height: 9px; border-radius: 999px; overflow: hidden; background: #EDF0F5; }
    .meter > span { display: block; height: 100%; transition: width .3s ease; }
    .meter > span + span { box-shadow: -1px 0 0 rgba(255,255,255,.85); }

    .check-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 2px; border-bottom: 1px dashed var(--border); }
    .check-row:last-child { border-bottom: none; }
    .check-mark { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; flex: 0 0 auto; margin-top: 1px; }
    .check-body { min-width: 0; }
    .check-label { font-size: 13.5px; font-weight: 500; color: var(--ink); }
    .check-note { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.45; }

    /* ---- Integrity ---- */
    .integ-row { display: flex; align-items: center; gap: 13px; padding: 12px; border-radius: 12px; transition: background .14s; }
    .integ-row:hover { background: #F7F9FD; }
    .integ-row + .integ-row { border-top: 1px solid #F0F2F7; }
    .integ-area-ico { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto; color: var(--navy); background: rgba(12,48,120,.07); border: 1px solid rgba(12,48,120,.1); }
    .integ-body { flex: 1 1 auto; min-width: 0; }
    .integ-area { font-size: 13.5px; font-weight: 600; color: var(--ink); }
    .integ-find { font-size: 12.5px; color: var(--muted); margin-top: 1px; line-height: 1.45; }
    .integ-badge { display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto; padding: 4px 10px 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }

    /* ---- Questions (accordions) ---- */
    .link-btn { font-size: 12.5px; font-weight: 600; color: var(--navy); padding: 6px 10px; border-radius: 8px; transition: background .14s; }
    .link-btn:hover { background: rgba(12,48,120,.06); }
    .accordion { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-sm); overflow: hidden; }
    .accordion.open { border-color: var(--border-strong); }
    .acc-head { display: flex; align-items: center; gap: 11px; width: 100%; padding: 14px 16px; text-align: left; transition: background .14s; }
    .acc-head:hover { background: #F7F9FD; }
    .acc-ico { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto; color: var(--navy); background: rgba(12,48,120,.07); }
    .acc-title { flex: 1 1 auto; min-width: 0; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 13.5px; color: var(--ink); }
    .acc-count { flex: 0 0 auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: var(--navy); background: rgba(12,48,120,.08); }
    .acc-chev { color: var(--hint); transition: transform .22s ease; flex: 0 0 auto; }
    .accordion.open .acc-chev { transform: rotate(180deg); color: var(--navy); }
    /* Smooth open/close with the grid-rows 0fr→1fr trick (no JS height math) */
    .acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .24s ease; }
    .accordion.open .acc-body { grid-template-rows: 1fr; }
    .acc-inner { overflow: hidden; }
    .q-list { margin: 0; padding: 2px 16px 16px 48px; list-style: decimal; }
    .q-list li { font-size: 13px; color: #374151; line-height: 1.5; padding: 4px 0; }
    .q-list li::marker { color: var(--gold); font-family: 'Sora', sans-serif; font-weight: 600; }

    /* ---- Thesis ---- */
    .reason-card { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); border-left-width: 3px; }
    .reason-card.pos { border-left-color: #10B981; background: rgba(16,185,129,.04); }
    .reason-card.neg { border-left-color: #F59E0B; background: rgba(245,158,11,.05); }
    .reason-point { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 13.5px; color: var(--ink); }
    .reason-detail { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
    .reason-mit { font-size: 12px; color: #4b5563; margin-top: 9px; line-height: 1.45; }
    .mit-label { display: inline-block; margin-right: 7px; padding: 1px 7px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--gold); background: rgba(180,146,76,.12); }

    /* ---- Returns ---- */
    .result-card { padding: 16px 18px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); background-image: linear-gradient(120deg, rgba(12,48,120,.03), transparent 55%); }
    .result-kick { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--hint); }
    .result-num { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05; color: var(--ink); margin-top: 4px; }
    .result-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .slider-row { padding: 13px 0; border-bottom: 1px dashed var(--border); }
    .slider-row:last-child { border-bottom: none; padding-bottom: 2px; }
    .slider-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
    .slider-label { font-size: 13px; color: var(--ink); font-weight: 500; }
    .slider-val { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 14px; color: var(--navy); flex: 0 0 auto; }
    .range { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px; background: #E4E8F0; outline: none; cursor: pointer; }
    .range:focus-visible { box-shadow: var(--ring-navy); }
    .range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--navy); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(12,48,120,.4); cursor: pointer; }
    .range::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--navy); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(12,48,120,.4); cursor: pointer; }

    /* ==================================================================== *
     *  PHASES 6–7 — Upload modal, progress, and the print memo
     * ==================================================================== */

    /* Upload form */
    .uz {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px;
      border: 1.5px dashed var(--border-strong); border-radius: var(--r-md); background: #FAFBFE;
      text-align: left; transition: border-color .15s, background .15s;
    }
    .uz:hover { border-color: var(--navy); background: rgba(12,48,120,.03); }
    .uz.has-file { border-style: solid; border-color: var(--border-strong); background: #fff; }
    .uz .uz-ico { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; flex: 0 0 auto; color: var(--navy); background: rgba(12,48,120,.08); }
    .uz.has-file .uz-ico { color: #fff; background: linear-gradient(150deg,#16419b,#0a2660); }
    .uz-body { min-width: 0; flex: 1 1 auto; }
    .uz-title { font-size: 13px; font-weight: 600; color: var(--ink); }
    .uz-title .req { color: #E11D48; }
    .uz-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--hint); margin-bottom: 4px; }
    .field input {
      width: 100%; height: 38px; padding: 0 11px; border: 1px solid var(--border); border-radius: 9px;
      font-size: 13px; color: var(--ink); background: #fff; transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus { outline: none; border-color: var(--navy); box-shadow: var(--ring-navy); }
    .form-err { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 10px; background: rgba(225,29,72,.07); border: 1px solid rgba(225,29,72,.22); color: #b91c1c; font-size: 12.5px; line-height: 1.45; }

    /* Progress state */
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Add-a-deal working screen (colourful, with progress bar) ---- */
    .gen-wrap { padding: 8px 2px 6px; }
    .gen-hero { display: grid; place-items: center; margin: 8px 0 16px; }
    .gen-hero-ic {
      width: 62px; height: 62px; border-radius: 17px; display: grid; place-items: center; color: #fff;
      background: linear-gradient(140deg, #2E6FD6, #0C3078);
      box-shadow: 0 14px 30px -10px rgba(12,48,120,.55); animation: heroFloat 2.6s ease-in-out infinite;
    }
    @keyframes heroFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .gen-head { text-align: center; font-size: 17px; font-weight: 600; color: var(--ink); }
    .gen-sub  { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; padding: 0 8px; }

    .pbar { position: relative; height: 9px; border-radius: 999px; background: #EDF0F5; overflow: hidden; margin: 18px 0 7px; }
    .pbar-fill {
      position: absolute; top: 0; left: 0; bottom: 0; width: 0%; border-radius: 999px;
      background: linear-gradient(90deg, #0C3078, #2E6FD6 55%, #14B8A6);
      transition: width .6s cubic-bezier(.25,.1,.25,1);
    }
    .pbar-fill::after {
      content: ''; position: absolute; inset: 0; border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
      animation: sheen 1.5s linear infinite;
    }
    @keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    .pbar-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 1px; }
    .pbar-elapsed { font-size: 11.5px; font-weight: 500; color: var(--hint); font-variant-numeric: tabular-nums; }
    .pbar-pct { text-align: right; font-size: 11.5px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
    .gdone-time { display: inline-flex; align-items: center; gap: 5px; margin: 14px auto 0; padding: 4px 11px; border-radius: 999px;
      font-size: 11.5px; font-weight: 600; color: #10B981; background: rgba(16,185,129,.09); }

    .gen-steps { margin-top: 12px; display: flex; flex-direction: column; gap: 2px; }
    .gstep { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 11px; transition: background .3s; }
    .gstep.is-active { background: rgba(46,111,214,.07); }
    .gstep-ic {
      width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: 0 0 auto;
      color: var(--hint); background: #EDF0F5; transition: color .3s, background .3s, box-shadow .3s;
    }
    .gstep.is-active .gstep-ic { color: #fff; background: linear-gradient(140deg, #2E6FD6, #0C3078); box-shadow: 0 7px 16px -7px rgba(12,48,120,.6); }
    .gstep.is-done   .gstep-ic { color: #fff; background: linear-gradient(140deg, #14B8A6, #10B981); }
    .gstep-label { flex: 1 1 auto; font-size: 13px; color: var(--hint); transition: color .3s; }
    .gstep.is-active .gstep-label { color: var(--ink); font-weight: 600; }
    .gstep.is-done   .gstep-label { color: var(--muted); }
    .gstep-stat { width: 18px; height: 18px; flex: 0 0 auto; display: grid; place-items: center; }
    .gspin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(12,48,120,.16); border-top-color: var(--navy); animation: spin .7s linear infinite; }
    .gcheck { color: #10B981; }

    /* Success state */
    .gdone { text-align: center; }
    .gdone-hero {
      width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; color: #fff; margin: 10px auto 0;
      background: linear-gradient(140deg, #14B8A6, #10B981); box-shadow: 0 14px 30px -10px rgba(16,185,129,.55);
      animation: popIn .45s cubic-bezier(.2,.9,.25,1);
    }
    @keyframes popIn { from { transform: scale(.55); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .gdone-actions { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px; }

    /* ---- The print memo (Export PDF) ---- */
    .print-only { display: none; }
    @media print {
      header, main, #toast-root, #modal-root { display: none !important; }
      #print-root { display: block !important; }
      html, body { background: #fff !important; }
      @page { margin: 13mm 14mm; }
    }
    /* On-screen preview support (headless test / debugging) mirrors the print look. */
    #print-root.preview { display: block; background: #fff; }
    .pm { font-family: 'Inter', sans-serif; color: #111827; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 10.5px; line-height: 1.45; max-width: 190mm; margin: 0 auto; }
    .pm * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pm-cover { border-bottom: 2px solid var(--navy); padding-bottom: 10px; margin-bottom: 12px; }
    .pm-eyebrow { font-family: 'Sora', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
    .pm-title-row { display: flex; align-items: center; gap: 11px; margin-top: 6px; }
    .pm-mono { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; color: #fff; background: #0C3078; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 14px; flex: 0 0 auto; }
    .pm h1 { font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700; margin: 0; line-height: 1.1; }
    .pm-titlesub { font-size: 11px; color: #6B7280; margin-top: 1px; }
    .pm-fit { margin-left: auto; padding: 4px 12px; border-radius: 999px; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 12px; white-space: nowrap; }
    .pm-fit-go { color: #047857; background: #D1FAE5; }
    .pm-fit-watch { color: #B45309; background: #FEF3C7; }
    .pm-fit-pass { color: #BE123C; background: #FFE4E6; }
    .pm-facts { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 9px; font-size: 10px; }
    .pm-facts b { color: #6B7280; font-weight: 600; margin-right: 5px; text-transform: uppercase; letter-spacing: .03em; font-size: 8.5px; }
    .pm-reason { margin: 8px 0 0; font-size: 10.5px; }
    .pm-reason b { color: #0C3078; }
    .pm-section { margin-top: 12px; break-inside: avoid; }
    .pm-section h2 { font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 700; color: #0C3078; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 6px; padding-bottom: 3px; border-bottom: 1px solid #E7EAF1; }
    .pm p { margin: 0 0 5px; }
    .pm-bullets { margin: 4px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; }
    .pm-bullets li { font-size: 9.5px; padding-left: 12px; position: relative; }
    .pm-bullets li::before { content: '▪'; color: var(--gold); position: absolute; left: 0; }
    table.pm-tbl { width: 100%; border-collapse: collapse; font-size: 9.5px; }
    table.pm-tbl th, table.pm-tbl td { border-bottom: 1px solid #EEF1F6; padding: 3px 5px; text-align: right; font-variant-numeric: tabular-nums; }
    table.pm-tbl th:first-child, table.pm-tbl td:first-child { text-align: left; }
    table.pm-tbl thead th { background: #F4F6FB; color: #374151; font-family: 'Sora', sans-serif; font-weight: 600; }
    table.pm-tbl td.neg { color: #DC2626; }
    table.pm-tbl .fc { background: rgba(180,146,76,.08); }
    .pm-facts-tbl td { padding: 3px 0; font-size: 10px; border-bottom: 1px dashed #E7EAF1; }
    .pm-facts-tbl td:first-child { color: #6B7280; width: 38%; }
    .pm-check { display: flex; align-items: baseline; gap: 7px; font-size: 9.8px; padding: 2.5px 0; }
    .pm-check .mk { font-weight: 700; width: 12px; flex: 0 0 auto; }
    .pm-check .nt { color: #6B7280; margin-left: 4px; }
    .pm-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; break-inside: avoid; }
    .pm-point { margin-bottom: 6px; }
    .pm-point b { font-size: 10px; }
    .pm-point span { display: block; color: #4b5563; font-size: 9.5px; }
    .pm-point .mit { color: #6B7280; font-style: italic; }
    .pm-foot { margin-top: 14px; padding-top: 6px; border-top: 1px solid #E7EAF1; font-size: 8.5px; color: #9CA3AF; text-align: center; }

    /* Respect reduced-motion preferences */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>

<body class="min-h-screen">
  <!-- ============================ HEADER ============================ -->
  <header class="app-header sticky top-0 z-40">
    <div class="mx-auto max-w-7xl px-4 sm:px-6">
      <div class="h-16 flex items-center justify-between gap-4">
        <!-- Brand: gold-accented PARAGON monogram + product title (click → pipeline home) -->
        <div id="brand-home" class="flex items-center gap-3 min-w-0 cursor-pointer group" role="button" tabindex="0" aria-label="Go to Deal Pipeline">
          <div class="monogram" aria-hidden="true">P</div>
          <div class="min-w-0 leading-tight">
            <div class="eyebrow">Paragon Partners</div>
            <div class="product-title group-hover:text-white/90 transition-colors">Screening Memo</div>
          </div>
        </div>

        <!-- Controls: company picker + export -->
        <div class="flex items-center gap-2 sm:gap-3">
          <div id="company-dd" class="relative">
            <button id="company-dd-btn" class="hdr-btn" type="button" aria-haspopup="true" aria-expanded="false">
              <span id="company-dd-ico" class="text-gold/90 flex"></span>
              <span class="hidden sm:inline">Open a company</span>
              <span class="sm:hidden">Company</span>
              <span id="company-dd-chev" class="flex transition-transform"></span>
            </button>
            <div id="company-dd-menu" class="dd-menu hidden" role="menu" aria-label="Companies"></div>
          </div>

          <button id="export-btn" class="hdr-btn is-disabled" type="button"
                  data-tip="PDF export is coming in a later phase" aria-disabled="true">
            <span id="export-ico" class="flex"></span>
            <span class="hidden sm:inline">Export PDF</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ============================ MAIN ============================ -->
  <main class="mx-auto max-w-7xl px-4 sm:px-6 py-7 sm:py-8">
    <div id="screen"><!-- pipeline OR company view, rendered by app.js --></div>
  </main>

  <!-- roots for transient UI -->
  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <!-- Print-only 2-page memo (built on demand by Export PDF; hidden on screen) -->
  <div id="print-root" class="print-only"></div>

  <!--
    pdf.js (read the IM) and SheetJS (read the Excel model) are loaded on demand
    from CDN the first time a partner uploads a deal — see ensureUploadLibs() in
    app.js — so they never slow the normal pipeline load.
  -->
  <script src="js/app.js"></script>
</body>
</html>
